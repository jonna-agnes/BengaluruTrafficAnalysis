# Airflow 3 (LocalExecutor) for the traffic_load_and_model DAG.
#   cd airflow && docker compose up -d --build          UI: http://localhost:8081
# airflow/.env and airflow/keys/ are written by `python -m cloud.setup snowflake`.

x-airflow: &airflow
  build: .
  image: traffic-airflow:3.1.0
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_SNOWFLAKE_TRAFFIC: >-
      {"conn_type": "snowflake", "login": "${SNOWFLAKE_USER}",
       "extra": {"account": "${SNOWFLAKE_ACCOUNT}", "warehouse": "${SNOWFLAKE_WAREHOUSE}",
                 "database": "${SNOWFLAKE_DATABASE}", "role": "${SNOWFLAKE_ROLE}",
                 "private_key_file": "${SNOWFLAKE_PRIVATE_KEY_PATH}"}}
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./dbt_profiles:/opt/airflow/dbt_profiles:ro
    - ./keys:/opt/airflow/keys:ro
    - ../traffic:/opt/airflow/traffic
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "airflow"], interval: 10s, retries: 5}

  init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  api-server:
    <<: *airflow
    command: api-server
    ports: ["8081:8080"]
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped

  scheduler:
    <<: *airflow
    command: scheduler
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped

  dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on: {init: {condition: service_completed_successfully}}
    restart: unless-stopped

volumes:
  airflow-db:
