# DuckDB profiles (no Snowflake needed). Run from the repo root:
#   local: reads Parquet the Spark job wrote with TRAFFIC_SINK=local
#     dbt build --project-dir traffic --profiles-dir traffic/profiles_local
#   cloud: reads Parquet straight from the S3 data lake (TRAFFIC_LOCAL_PATH=s3://<bucket>)
#     dbt build --project-dir traffic --profiles-dir traffic/profiles_local --target cloud
# Snowflake (production) uses airflow/dbt_profiles/profiles.yml instead.
traffic:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('TRAFFIC_DUCKDB_PATH', 'output/traffic.duckdb') }}"
      schema: main
      threads: 1
      settings:
        TimeZone: Asia/Kolkata

    cloud:
      type: duckdb
      path: "{{ env_var('TRAFFIC_DUCKDB_PATH', 'output/traffic.duckdb') }}"
      schema: main
      threads: 4
      extensions: [httpfs, aws]
      settings:
        TimeZone: Asia/Kolkata
      secrets:
        - type: s3
          provider: credential_chain
          chain: config
          profile: "{{ env_var('AWS_PROFILE', 'jo-cli') }}"
          region: "{{ env_var('AWS_REGION', 'ap-south-1') }}"
